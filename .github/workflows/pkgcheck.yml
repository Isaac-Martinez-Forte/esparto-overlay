name: Gentoo QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare QA tools and Gentoo master repository
        run: |
          mkdir -p .qa/etc/portage
          python -m venv .qa/venv
          .qa/venv/bin/pip install 'pkgcheck==0.10.34' 'tree-sitter==0.24.0' 'tree-sitter-bash==0.23.3'
          git clone --depth 1 https://github.com/gentoo/gentoo.git .qa/gentoo
          printf '[DEFAULT]\nmain-repo = gentoo\n[gentoo]\nlocation = %s/.qa/gentoo\n[esparto]\nlocation = %s\n' "$PWD" "$PWD" > .qa/etc/portage/repos.conf
          ln -s "$PWD/.qa/gentoo/profiles/default/linux/amd64/23.0" .qa/etc/portage/make.profile
      - name: Check ebuild syntax
        run: |
          while IFS= read -r -d '' ebuild; do
            bash -n "$ebuild"
          done < <(find . -name '*.ebuild' -not -path './.qa/*' -print0)
      - name: Check packaging scripts
        run: python -m compileall -q .github/scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NSS test utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3-tools
      - name: Test AutoFirma browser setup
        run: python app-crypt/autofirma/files/autofirma-browser-test.py
      - name: Check overlay quality
        run: .qa/venv/bin/pkgcheck scan --repo "$PWD" --exit error
